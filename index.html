<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ઔદ્યોગિક તાલીમ સંસ્થા, અંકલેશ્વર - તાલીમાર્થી નોંધણી ફોર્મ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; background: #fff; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 5px; }
        .sub-header { text-align: center; font-size: 14px; color: #666; margin-bottom: 25px; font-weight: bold; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; text-transform: uppercase; }
        input:focus, select:focus, textarea:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 5px rgba(26,115,232,0.3); }
        .missing-field { background-color: #fff3cd !important; border-color: #ffeba4 !important; }
        .roll-box { background-color: #e8f0fe !important; font-weight: bold; font-size: 18px; color: #1a73e8; }
        .aadhaar-group { display: flex; gap: 10px; }
        .aadhaar-group input { text-align: center; font-weight: bold; letter-spacing: 2px; }
        .btn-container { text-align: center; margin-top: 30px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ઔદ્યોગિક તાલીમ સંસ્થા, અંકલેશ્વર</h2>
    <div class="sub-header">મિકેનિક ડીઝલ ટ્રેડ - તાલીમાર્થી માહિતી પત્રક (બૅચ ૮૪)</div>

    <!-- Roll Number Search Box -->
    <div class="form-group no-print">
        <label for="rollInput">તમારો રોલ નંબર (Roll No) અહીં લખો:</label>
        <input type="number" id="rollInput" class="roll-box" placeholder="દા.ત. 1, 2, 3..." oninput="loadDataByRollNo()">
        <small style="color: #666; display: block; margin-top: 5px;">રોલ નંબર લખતા જ તમારી વિગતો ઓટોમેટિક આવી જશે.</small>
    </div>

    <form id="registrationForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label>તાલીમાર્થીનું પૂરું નામ (Trainee Full Name):</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>એનરોલમેન્ટ નંબર (Enrollment No):</label>
            <input type="text" id="enroll">
        </div>

        <div class="form-group">
            <label>તાલીમાર્થીનો મોબાઈલ નંબર:</label>
            <input type="tel" id="mobile" maxlength="10">
        </div>

        <div class="form-group">
            <label>વાલીનો મોબાઈલ નંબર:</label>
            <input type="tel" id="guardian_mobile" maxlength="10" class="missing-field" placeholder="માહિતી ખૂટે છે - કૃપા કરીને ભરો">
        </div>

        <div class="form-group">
            <label>બેંકનું નામ (Bank Name):</label>
            <select id="bank_name" class="missing-field" onchange="checkMissingFields()">
                <option value="">-- બેંક પસંદ કરો --</option>
                <option value="BANK OF BARODA">BANK OF BARODA (બેંક ઓફ બરોડા)</option>
                <option value="STATE BANK OF INDIA">STATE BANK OF INDIA (સ્ટેટ બેંક ઓફ ઇન્ડિયા)</option>
                <option value="HDFC BANK">HDFC BANK (એચડીએફસી બેંક)</option>
                <option value="ICICI BANK">ICICI BANK (આઈસીઆઈસીઆઈ બેંક)</option>
                <option value="PUNJAB NATIONAL BANK">PUNJAB NATIONAL BANK (પંજાબ નેશનલ બેંક)</option>
                <option value="BANK OF INDIA">BANK OF INDIA (બેંક ઓફ ઇન્ડિયા)</option>
                <option value="AXIS BANK">AXIS BANK (એક્સિસ બેંક)</option>
                <option value="KOTAK MAHINDRA BANK">KOTAK MAHINDRA BANK (કોટક મહેન્દ્રા બેંક)</option>
                <option value="UCO BANK">UCO BANK (યુકો બેંક)</option>
                <option value="UNION BANK OF INDIA">UNION BANK OF INDIA (યુનિયન બેંક ઓફ ઇન્ડિયા)</option>
                <option value="CANARA BANK">CANARA BANK (કેનરા બેંક)</option>
                <option value="BARODA GUJARAT GRAMIN BANK">BARODA GUJARAT GRAMIN BANK (બરોડા ગુજરાત ગ્રામીણ બેંક)</option>
                <option value="OTHER">અન્ય બેંક (OTHER)</option>
            </select>
        </div>

        <div class="form-group">
            <label>બેંક બ્રાન્ચનું નામ (Branch Name):</label>
            <input type="text" id="branch_name" class="missing-field" placeholder="બ્રાન્ચનું નામ લખો">
        </div>

        <div class="form-group">
            <label>બેંક એકાઉન્ટ નંબર (આગળના ઝીરો સચવાશે):</label>
            <input type="text" id="bank_acc">
        </div>

        <div class="form-group">
            <label>બેંક આઈએફએસસી કોડ (IFSC Code):</label>
            <input type="text" id="ifsc">
        </div>

        <div class="form-group">
            <label>આધાર કાર્ડ નંબર (૪-૪-૪ અંકના ખાના):</label>
            <div class="aadhaar-group">
                <input type="text" id="aadhaar1" maxlength="4" oninput="moveFocus(this, 'aadhaar2')">
                <input type="text" id="aadhaar2" maxlength="4" oninput="moveFocus(this, 'aadhaar3')">
                <input type="text" id="aadhaar3" maxlength="4">
            </div>
        </div>

        <div class="form-group">
            <label>પૂરું સરનામું (Address):</label>
            <textarea id="address" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>તાલુકો:</label>
            <input type="text" id="taluka" class="missing-field" value="અંકલેશ્વર">
        </div>

        <div class="form-group">
            <label>જિલ્લો:</label>
            <input type="text" id="district" class="missing-field" value="ભરૂચ">
        </div>

        <div class="btn-container no-print">
            <button type="submit">ડેટા સેવ કરો અને PDF પ્રિન્ટ/ડાઉનલોડ કરો</button>
        </div>
    </form>
</div>

<script>
    // એક્સેલ ડેટા (રોલ નંબર સાથે)
    const traineesData = {
        "1": {"name": "MANISHBHAI DHARMESHBHAI VASAVA", "enroll": "403840018", "mobile": "7859895395", "bank_acc": "2210100049097", "ifsc": "BARB0ANKLES", "address": "PADMAVATI SOCIETY, PRATHAMIK SHALA, ANKLESHWAR - 393001"},
        "2": {"name": "SUJALBHAI RAMESHBHAI RATHOD", "enroll": "403840019", "mobile": "6352546992", "bank_acc": "", "ifsc": "", "address": "NAVINAGARI, DHAVAT, DHAVAT - 391210"},
        "3": {"name": "SIDDHARTHBHAI BALVANTBHAI PARMAR", "enroll": "403840024", "mobile": "6359273842", "bank_acc": "", "ifsc": "", "address": ""},
        "4": {"name": "MOHAMMAD MUNAF ASFAK SHAIKH", "enroll": "403840162", "mobile": "6352345007", "bank_acc": "", "ifsc": "", "address": ""},
        "5": {"name": "FARHAN FIROZBHAI CHAUHAN", "enroll": "403840175", "mobile": "9662329767", "bank_acc": "", "ifsc": "", "address": ""},
        "6": {"name": "HITESH RANJEETBHAI MALI", "enroll": "403840196", "mobile": "9825745113", "bank_acc": "", "ifsc": "", "address": ""},
        "7": {"name": "DHRUVKUMAR HARESHBHAI RANA", "enroll": "403840216", "mobile": "8758448319", "bank_acc": "", "ifsc": "", "address": ""},
        "8": {"name": "AZAZ IMRAN SIDAT", "enroll": "403840293", "mobile": "7990748072", "bank_acc": "", "ifsc": "", "address": ""},
        "9": {"name": "KRISHKUMAR KAMLESHBHAI MACHHI", "enroll": "403840342", "mobile": "8401905875", "bank_acc": "", "ifsc": "", "address": ""},
        "10": {"name": "KRUNAL RAJNIKANT PADHIYAR", "enroll": "403840403", "mobile": "9227014653", "bank_acc": "", "ifsc": "", "address": ""},
        "11": {"name": "ZAKIRHUSEN LIYAKAT HUSHEN KAPADIYA", "enroll": "403840640", "mobile": "9429334406", "bank_acc": "", "ifsc": "", "address": ""},
        "12": {"name": "VIVEK MAHESH RAJPUT", "enroll": "403840642", "mobile": "9106223868", "bank_acc": "", "ifsc": "", "address": ""},
        "13": {"name": "MOHMMAD SAJJAD MOHAMMAD SARFARAJ SHAIKH", "enroll": "403840774", "mobile": "9106313731", "bank_acc": "", "ifsc": "", "address": ""},
        "14": {"name": "RIZWANBEG MAKBULBEG MIRZA", "enroll": "403840813", "mobile": "7874463177", "bank_acc": "", "ifsc": "", "address": ""},
        "15": {"name": "AHMED ABDULSAMAD SEDU", "enroll": "403840817", "mobile": "9157158318", "bank_acc": "", "ifsc": "", "address": ""},
        "16": {"name": "MOHMED MUZAHID IRFAN SHAIKH", "enroll": "403840847", "mobile": "9409763934", "bank_acc": "", "ifsc": "", "address": ""},
        "17": {"name": "ALFAZHHUSEN IMRANMIYA MALEK", "enroll": "403840941", "mobile": "7041612254", "bank_acc": "", "ifsc": "", "address": ""},
        "18": {"name": "HARSH KISHORRAV BORSE", "enroll": "403840956", "mobile": "9737829388", "bank_acc": "", "ifsc": "", "address": ""},
        "19": {"name": "MAHAMMADFAYAZ LUKMAN ABHLI", "enroll": "403840971", "mobile": "8140555455", "bank_acc": "", "ifsc": "", "address": ""},
        "20": {"name": "VISHNUBHAI RAMESHBHAI RATHVA", "enroll": "403841017", "mobile": "9824802827", "bank_acc": "", "ifsc": "", "address": ""},
        "21": {"name": "MUBARAK ALTAFBHAI MAHAMMADBHAI SHEKH", "enroll": "403841024", "mobile": "8460683648", "bank_acc": "", "ifsc": "", "address": ""},
        "22": {"name": "MO REHAN SALAUDDIN KURESHI", "enroll": "403841025", "mobile": "8401590216", "bank_acc": "", "ifsc": "", "address": ""},
        "49": {"name": "HIMLESHKUMAR SURESHBHAI VASAVA", "enroll": "403840180", "mobile": "9274925189", "bank_acc": "", "ifsc": "", "address": "VADI FALIYU, PRATHAMIK SHALA DIWA, NAVA DIWA - 393001"},
        "50": {"name": "AYUSHBHAI SHAMJIBHAI MAKVANA", "enroll": "403840530", "mobile": "9023113573", "bank_acc": "3005010000000", "ifsc": "BARB0BGGBXX", "address": "ALEX FARM HOUSE, UCHHALI, UCHHALI - 393001"}
    };

    function loadDataByRollNo() {
        const roll = document.getElementById('rollInput').value.trim();
        
        if (traineesData[roll]) {
            const t = traineesData[roll];
            document.getElementById('name').value = t.name || '';
            document.getElementById('enroll').value = t.enroll || '';
            document.getElementById('mobile').value = t.mobile || '';
            document.getElementById('guardian_mobile').value = '';
            document.getElementById('bank_acc').value = t.bank_acc || '';
            document.getElementById('ifsc').value = t.ifsc || '';
            document.getElementById('address').value = t.address || '';
            document.getElementById('taluka').value = 'અંકલેશ્વર';
            document.getElementById('district').value = 'ભરૂચ';

            if (t.ifsc.startsWith('BARB')) {
                document.getElementById('bank_name').value = 'BANK OF BARODA';
            } else if (t.ifsc.startsWith('SBIN')) {
                document.getElementById('bank_name').value = 'STATE BANK OF INDIA';
            } else {
                document.getElementById('bank_name').value = '';
            }
        } else {
            // જો રોલ નંબર ન મળે તો ફોર્મ ખાલી કરી દો
            document.getElementById('name').value = '';
            document.getElementById('enroll').value = '';
            document.getElementById('mobile').value = '';
            document.getElementById('bank_acc').value = '';
            document.getElementById('ifsc').value = '';
            document.getElementById('address').value = '';
        }
        checkMissingFields();
    }

    function checkMissingFields() {
        const fields = ['guardian_mobile', 'bank_name', 'branch_name', 'taluka', 'district'];
        fields.forEach(id => {
            let el = document.getElementById(id);
            if (el.value.trim() === "") {
                el.classList.add('missing-field');
            } else {
                el.classList.remove('missing-field');
            }
        });
    }

    function moveFocus(current, nextFieldId) {
        if (current.value.length >= current.maxLength) {
            document.getElementById(nextFieldId).focus();
        }
    }

    // ઓટો કેપિટલ
    document.querySelectorAll('input, textarea').forEach(element => {
        element.addEventListener('input', function(e) {
            if(e.target.id !== 'mobile' && e.target.id !== 'guardian_mobile' && e.target.id !== 'bank_acc' && !e.target.id.includes('aadhaar')) {
                this.value = this.value.toUpperCase();
            }
            checkMissingFields();
        });
    });

    function submitForm(event) {
        event.preventDefault();
        
        const formData = {
            roll_no: document.getElementById('rollInput').value,
            name: document.getElementById('name').value,
            enroll: document.getElementById('enroll').value,
            mobile: document.getElementById('mobile').value,
            guardian_mobile: document.getElementById('guardian_mobile').value,
            bank_name: document.getElementById('bank_name').value,
            branch_name: document.getElementById('branch_name').value,
            bank_acc: document.getElementById('bank_acc').value,
            ifsc: document.getElementById('ifsc').value,
            aadhaar: document.getElementById('aadhaar1').value + '-' + document.getElementById('aadhaar2').value + '-' + document.getElementById('aadhaar3').value,
            address: document.getElementById('address').value,
            taluka: document.getElementById('taluka').value,
            district: document.getElementById('district').value
        };

        const scriptURL = 'https://script.google.com/macros/s/AKfycbzKuiUMy3O1yXRexv3T14SUgW1OdAmNbPt9d0MKlHYCCnN1fy3pYr0tD9LcotJAXYFVCw/exec';
        
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) })
        .then(() => {
            alert('ડેટા સફળતાપૂર્વક Google Sheet માં સેવ થઈ ગયો છે!');
            window.print();
        })
        .catch(error => {
            console.error('Error!', error.message);
            window.print();
        });
    }
</script>

</body>
</html>
