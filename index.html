        .form-group { margin-bottom: 8px; position: relative; }

        .aadhaar-group input { text-align: center; font-weight: bold; letter-spacing: 2px; }
        .hidden { display: none !important; }
        .btn-container { text-align: center; margin-top: 12px; }

            }

                display: none !important;
            }

                border: 1px solid #999 !important;

<body>

<div class="container">
    <h2>ઔદ્યોગિક તાલીમ સંસ્થા, અંકલેશ્વર</h2>
    <div class="sub-header">મિકેનિક ડીઝલ ટ્રેડ - તાલીમાર્થી માહિતી પત્રક (બૅચ ૮૪)</div>

    <!-- Roll Number Search Box -->
    <div class="form-group no-print">
        <label for="rollInput">તમારો રોલ નંબર (Roll No) અહીં લખો:</label>
        <input type="number" id="rollInput" class="roll-box" placeholder="દા.ત. 1, 2, 3, 49..." oninput="loadDataByRollNo()">

    </div>

    <form id="registrationForm" onsubmit="submitForm(event)">
        <div class="form-group">
            <label>તાલીમાર્થીનું પૂરું નામ (Trainee Full Name):</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>એનરોલમેન્ટ નંબર (Enrollment No):</label>
            <input type="text" id="enroll">
        </div>

        <div class="form-group">
            <label>તાલીમાર્થીનો મોબાઈલ નંબર:</label>
            <input type="tel" id="mobile" maxlength="10">
        </div>

        <div class="form-group">
            <label>વાલીનો મોબાઈલ નંબર:</label>
            <input type="tel" id="guardian_mobile" maxlength="10" class="missing-field" placeholder="માહિતી ખૂટે છે - કૃપા કરીને ભરો">
        </div>

                <option value="ICICI BANK">ICICI BANK (આઈસીઆઈસીઆઈ બેંક)</option>
                <option value="PUNJAB NATIONAL BANK">PUNJAB NATIONAL BANK (પંજાબ નેશનલ બેંક)</option>
                <option value="BANK OF INDIA">BANK OF INDIA (બેંક ઓફ ઇન્ડિયા)</option>
                <option value="AXIS BANK">AXIS BANK (એક્સિસ બેંક)</option>
                <option value="KOTAK MAHINDRA BANK">KOTAK MAHINDRA BANK (કોટક મહેન્દ્રા બેંક)</option>
                <option value="UCO BANK">UCO BANK (યુકો બેંક)</option>
                <option value="UNION BANK OF INDIA">UNION BANK OF INDIA (યુનિયન બેંક ઓફ ઇન્ડિયા)</option>
                <option value="CANARA BANK">CANARA BANK (કેનરા બેંક)</option>
                <option value="BARODA GUJARAT GRAMIN BANK">BARODA GUJARAT GRAMIN BANK (બરોડા ગુજરાત ગ્રામીણ બેંક)</option>
                <option value="OTHER">અન્ય બેંક (OTHER)</option>
            </select>
        </div>

            <label>અન્ય બેંકનું નામ લખો (Other Bank Name):</label>

        </div>

            <label>બેંક બ્રાન્ચનું નામ (Branch Name):</label>
            <input type="text" id="branch_name" class="missing-field" placeholder="બ્રાન્ચનું નામ લખો">
        </div>

        <div class="form-group">
            <label>બેંક એકાઉન્ટ નંબર (આગળના ઝીરો સચવાશે):</label>

        </div>

            <label>પૂરું સરનામું (Address):</label>

        </div>

        <div class="form-group">

            <input type="text" id="taluka" class="missing-field" value="અંકલેશ્વર">
        </div>

        <div class="form-group">
            <label>જિલ્લો:</label>
            <input type="text" id="district" class="missing-field" value="ભરૂચ">
        </div>

        </div>
    </form>
</div>

    function loadDataByRollNo() {
        const roll = document.getElementById('rollInput').value.trim();
        
        if (traineesData[roll]) {
            const t = traineesData[roll];
            document.getElementById('name').value = t.name || '';
            document.getElementById('enroll').value = t.enroll || '';
            document.getElementById('mobile').value = t.mobile || '';
            document.getElementById('guardian_mobile').value = '';
            document.getElementById('bank_acc').value = t.bank_acc || '';
            document.getElementById('ifsc').value = t.ifsc || '';
            document.getElementById('address').value = t.address || '';
            document.getElementById('taluka').value = 'અંકલેશ્વર';
            document.getElementById('district').value = 'ભરૂચ';

            // IFSC કોડના આધારે બેંકનું નામ ઓટો-સિલેક્ટ કરો
            const ifsc = t.ifsc.toUpperCase();
            if (ifsc.startsWith('BARB')) {
                document.getElementById('bank_name').value = 'BANK OF BARODA';
            } else if (ifsc.startsWith('SBIN')) {
                document.getElementById('bank_name').value = 'STATE BANK OF INDIA';
            } else if (ifsc.startsWith('HDFC')) {
                document.getElementById('bank_name').value = 'HDFC BANK';
            } else if (ifsc.startsWith('ICIC')) {
                document.getElementById('bank_name').value = 'ICICI BANK';
            } else if (ifsc.startsWith('PUNB')) {
                document.getElementById('bank_name').value = 'PUNJAB NATIONAL BANK';
            } else if (ifsc.startsWith('UTIB')) {
                document.getElementById('bank_name').value = 'AXIS BANK';
            } else if (ifsc.startsWith('UBIN')) {
                document.getElementById('bank_name').value = 'UNION BANK OF INDIA';
            } else if (ifsc.startsWith('CNRB')) {
                document.getElementById('bank_name').value = 'CANARA BANK';
            } else if (ifsc.startsWith('IDIB')) {
                document.getElementById('bank_name').value = 'INDIAN BANK';
            } else if (ifsc !== '') {
                document.getElementById('bank_name').value = 'OTHER';
                document.getElementById('other_bank_name').value = ifsc;
            } else {
                document.getElementById('bank_name').value = '';
            }
        } else {
            document.getElementById('name').value = '';
            document.getElementById('enroll').value = '';
            document.getElementById('mobile').value = '';
            document.getElementById('bank_acc').value = '';
            document.getElementById('ifsc').value = '';
            document.getElementById('address').value = '';
        }
        handleBankSelection();
        checkMissingFields();
    }

    function handleBankSelection() {
        const bankSelect = document.getElementById('bank_name');
        const otherGroup = document.getElementById('otherBankGroup');
        
        if (bankSelect.value === 'OTHER') {
            otherGroup.classList.remove('hidden');
        } else {
            otherGroup.classList.add('hidden');
            document.getElementById('other_bank_name').value = '';
        }
        checkMissingFields();
    }

    function checkMissingFields() {
        const fields = ['guardian_mobile', 'bank_name', 'branch_name', 'taluka', 'district'];
        fields.forEach(id => {
            let el = document.getElementById(id);
            if (el && el.value.trim() === "") {
                el.classList.add('missing-field');
            } else if (el) {
                el.classList.remove('missing-field');
            }
        });

        const bankSelect = document.getElementById('bank_name');
        const otherInput = document.getElementById('other_bank_name');
        if (bankSelect && bankSelect.value === 'OTHER') {
            if (otherInput && otherInput.value.trim() === "") {
                otherInput.classList.add('missing-field');
            } else if (otherInput) {
                otherInput.classList.remove('missing-field');
            }
        }
    }

    function moveFocus(current, nextFieldId) {
        if (current.value.length >= current.maxLength) {
            document.getElementById(nextFieldId).focus();
        }
    }

    // ઓટો કેપિટલ
    document.querySelectorAll('input, textarea').forEach(element => {
        element.addEventListener('input', function(e) {
            if(e.target.id !== 'mobile' && e.target.id !== 'guardian_mobile' && e.target.id !== 'bank_acc' && !e.target.id.includes('aadhaar')) {
                this.value = this.value.toUpperCase();
            }
            checkMissingFields();
        });
    });

    function submitForm(event) {
        event.preventDefault();
        
        let finalBankName = document.getElementById('bank_name').value;
        if (finalBankName === 'OTHER') {
            finalBankName = document.getElementById('other_bank_name').value.toUpperCase();
        }

        const formData = {
            roll_no: document.getElementById('rollInput').value,
            name: document.getElementById('name').value,
            enroll: document.getElementById('enroll').value,
            mobile: document.getElementById('mobile').value,
            guardian_mobile: document.getElementById('guardian_mobile').value,
            bank_name: finalBankName,
            branch_name: document.getElementById('branch_name').value,
            bank_acc: document.getElementById('bank_acc').value,
            ifsc: document.getElementById('ifsc').value,
            aadhaar: document.getElementById('aadhaar1').value + '-' + document.getElementById('aadhaar2').value + '-' + document.getElementById('aadhaar3').value,
            address: document.getElementById('address').value,
            taluka: document.getElementById('taluka').value,
            district: document.getElementById('district').value
        };

        const scriptURL = 'https://script.google.com/macros/s/AKfycbzKuiUMy3O1yXRexv3T14SUgW1OdAmNbPt9d0MKlHYCCnN1fy3pYr0tD9LcotJAXYFVCw/exec';
        
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) })
        .then(() => {
            alert('ડેટા સફળતાપૂર્વક Google Sheet માં સેવ થઈ ગયો છે!');
            window.print();
        })
        .catch(error => {
            console.error('Error!', error.message);
            window.print();
        });
    }
</script>

</body>
</html>
